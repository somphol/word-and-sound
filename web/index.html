<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('word-and-sound:settings:v1') || '{}');
        var text = Math.min(1.3, Math.max(0.9, Number(saved.textScale) || 1));
        var word = Math.min(1.6, Math.max(1, Number(saved.wordScale) || 1));
        var theme = saved.theme;
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } else if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        var accents = ['blue', 'teal', 'violet', 'amber'];
        var palette = accents.indexOf(saved.palette) >= 0 ? saved.palette : 'blue';
        document.documentElement.style.fontSize = (16 * text) + 'px';
        document.documentElement.style.setProperty('--word-scale', String(word));
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = palette;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6fa' : '#090d13');
      } catch (error) {}
    </script>
    <meta name="description" content="Word & Sound — English pronunciation drills with IPA, articulation coaching and spaced review." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="canonical" href="https://somphol.github.io/word-and-sound/" />
