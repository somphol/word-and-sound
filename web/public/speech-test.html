<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Speech diagnostic — Word &amp; Sound</title>
<style>
  body { margin:0; padding:24px; background:#0b1018; color:#e8eef8; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#9aa8bd; }
  button { display:block; width:100%; min-height:52px; margin:8px 0; border:1px solid rgba(255,255,255,.16); border-radius:12px; background:#172130; color:#e8eef8; font-size:16px; text-align:left; padding:12px 16px; }
  button:active { background:#223044; }
  pre { white-space:pre-wrap; background:#0f1620; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:12px; font-size:13px; min-height:120px; }
  small { color:#64748b; }
</style>
</head>
<body>
<h1>Speech diagnostic</h1>
<p>Tap each button. Note which ones make sound, then copy the log.</p>
<div id="buttons"></div>
<p><strong>Voices</strong>: <span id="voices">loading…</span></p>
<pre id="log"></pre>
<script>
  const logEl = document.getElementById('log')
  const log = (message) => {
    const time = new Date().toLocaleTimeString()
    logEl.textContent += `${time}  ${message}\n`
    console.log(message)
  }
  const synth = window.speechSynthesis
  const voicesEl = document.getElementById('voices')
  const loadVoices = () => {
    const voices = synth ? synth.getVoices() : []
    voicesEl.textContent = voices.length
      ? voices.map(v => `${v.name} (${v.lang}${v.localService ? ', local' : ''})`).join(' · ')
      : 'none yet'
  }
  loadVoices()
  if (synth) synth.addEventListener('voiceschanged', loadVoices)
  if (!synth) log('speechSynthesis is missing')
  if (!window.SpeechSynthesisUtterance) log('SpeechSynthesisUtterance is missing')

  function run(label, options = {}) {
    if (!synth) return
    log(`${label}: start`)
    if (options.cancel) { synth.cancel(); log('cancel()') }
    if (options.resume) { synth.resume(); log('resume()') }
    const utterance = new SpeechSynthesisUtterance(options.text || 'Hello. Testing one, two, three.')
    if (options.lang) utterance.lang = options.lang
    if (options.voice) utterance.voice = options.voice
    if (options.rate) utterance.rate = options.rate
    utterance.volume = 1
    utterance.onstart = () => log(`${label}: onstart`)
    utterance.onend = () => log(`${label}: onend`)
    utterance.onerror = (event) => log(`${label}: onerror ${event.error || event.name || 'unknown'}`)
    const speak = () => { synth.speak(utterance); log(`${label}: speak() called`) }
    if (options.delay) setTimeout(speak, options.delay)
    else speak()
  }

  const variants = [
    ['1. Plain utterance', {}],
    ['2. With lang en-US', { lang: 'en-US' }],
    ['3. With first English voice', { lang: 'en-US', voice: synth ? synth.getVoices().find(v => v.lang.toLowerCase().startsWith('en')) : null }],
    ['4. cancel(), then speak immediately', { cancel: true, lang: 'en-US' }],
    ['5. cancel(), wait 200 ms, speak', { cancel: true, delay: 200, lang: 'en-US' }],
    ['6. Slow rate 0.8', { lang: 'en-US', rate: 0.8 }],
  ]
  const container = document.getElementById('buttons')
  for (const [label, options] of variants) {
    const button = document.createElement('button')
    button.textContent = label
    button.onclick = () => run(label, options)
    container.appendChild(button)
  }
  log('ready')
</script>
</body>
</html>
