name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Headless self-test
        run: swift run wordandsound-selftest

      - name: Package app
        run: make app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WordAndSound-app
          path: build/WordAndSound.app
          if-no-files-found: error
