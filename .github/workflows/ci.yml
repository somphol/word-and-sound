name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Swift version
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Headless self-test
        run: swift run wordandsound-selftest
